<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Sign-Up-Form</title>
</head>
<body>
    <div class="container">
    <div class="logo">
    <img src="images/odin-lined.png" alt="Odin Image">
    <p>ODIN</p>
    </div>
    <div class="sign-up-container">
    <div class="sign-up-greeting">
    <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up <i>now</i> to get started.</p>
    <br>
    <p>You <i>know</i> you want to.</p>
    </div>
    <h2>Sign Up</h2>
    <form>
        <div class="form-container">
        <div class="form-row-one">
            <div class="input-groups">
                <label for="first-name-input">FIRST NAME</label>
                <input type="text" name="firstname" id="first-name-input" placeholder="Thor" required>
            </div>

            <div class="input-groups">
                <label for="last-name-input">LAST NAME</label>
                <input type="text" name="lastname" id="last-name-input" placeholder="Odinson" required>
            </div>
        </div>

        <div class="form-row-two">
            <div class="input-groups">
                <label for="email-input">EMAIL</label>
                <input type="email" name="email" id="email-input" placeholder="email@email.com" required>
            </div>

            <div class="input-groups">
                <label for="phone-input">PHONE NUMBER</label>
                <input type="tel" name="phone" id="phone-input" placeholder="555-555-5555" required>
            </div>
        </div>

        
        <div class="form-row-three">
            <div class="input-groups">
                <label for="password-input">PASSWORD</label>
                <input type="password" name="password" id="password-input" placeholder="Password" required minlength="8">
            </div>

            <div class="input-groups">
                <label for="confirm-password-input">CONFIRM PASSWORD</label>
                <input type="password" name="confirm-password" id="confirm-password-input" placeholder="Confirm Password" required minlength="8">
            </div>
        </div>
        </div>
        <hr class="divider">
        
        <button class="submit-button" type="submit">Create Account</button>
    </form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
    </div>
    <footer class="credit">Photo from Pexels.com from Daniel Flores.</footer>
</body>

</html>
