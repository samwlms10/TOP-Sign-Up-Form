<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <div class="sign-up-container">
    <div class="sign-up-greeting">
    <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Praesentium veniam eum, excepturi sit, eligendi laudantium, accusamus assumenda consequuntur rerum amet non. Possimus dolorem suscipit dolores laudantium illo porro libero mollitia!</p>
    </div>
    <H1>Sign Up</H1>
    <Form>
        <div class="form-container">
        <div class="form-row-one">
            <div class="input-groups">
                <label for="firstname-input">FIRST NAME</label>
                <input type="text" name="firstname" id="firstname-input" placeholder="Thor" required>
            </div>

            <div class="input-groups">
                <label for="lastname-input">LAST NAME</label>
                <input type="text" name="lastname" id="lastname-input" placeholder="Odinson" required>
            </div>
        </div>

        <div class="form-row-two">
            <div class="input-groups">
                <label for="email-input">EMAIL</label>
                <input type="email" name="email" id="email-input" placeholder="email@email.com" required>
            </div>

            <div class="input-groups">
                <label for="phone-input">PHONE NUMBER</label>
                <input type="tel" name="phone" id="phone-input" placeholder="555-555-5555" required>
            </div>
        </div>

        
        <div class="form-row-three">
            <div class="input-groups">
                <label for="password-input">PASSWORD</label>
                <input type="password" name="password" id="password-input" placeholder="Password" required>
            </div>

            <div class="input-groups">
                <label for="confirm-password-input">CONFIRM PASSWORD</label>
                <input type="password" name="confirm-password" id="confirm-password-input" placeholder="Confirm Password" required>
            </div>
        </div>
        </div>
        
        <button class="submit-button" type="submit">Create Account</button>
    </Form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
    </div>
</body>
<script src="SignUpForm.js"></script>
</html>
